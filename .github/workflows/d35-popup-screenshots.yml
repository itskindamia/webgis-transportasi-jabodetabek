name: D3.5 Popup/Panel Screenshot Review

on:
  pull_request:
    paths:
      - 'css/popup-comfort.css'
      - 'js/stop-popup-ui.js'
      - 'tools/capture-d35-popup-comfort.mjs'
      - '.github/workflows/d35-popup-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Capture and compare popup versus panel
        run: node tools/capture-d35-popup-comfort.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d35-popup-comfort-visual-review
          path: artifacts/d35-comfort/
          if-no-files-found: warn
