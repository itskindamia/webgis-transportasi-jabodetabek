name: P0 Popup Assertions

on:
  pull_request:
    paths:
      - 'tools/test-layout-release.mjs'
      - 'tools/test-lrt-popup.mjs'
      - '.github/workflows/p0-popup-assertions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  popup-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test LRT popup semantics and real scroll/action reachability
        run: node --test --test-reporter=tap --test-concurrency=1 tools/test-layout-release.mjs tools/test-lrt-popup.mjs
