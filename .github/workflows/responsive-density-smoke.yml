name: Responsive density smoke

on:
  pull_request:
    paths:
      - 'css/layout-tabler.css'
      - 'css/lrt-popup-mobile-v2.css'
      - 'css/stop-popup-mobile.css'
      - 'tools/test-mobile-popup-system.mjs'
      - 'css/mobile-active-route.css'
      - 'tools/test-mobile-active-route.mjs'
      - 'tools/test-lrt-popup-compact-mobile.mjs'
      - 'index.html'
      - 'tools/test-layout-density.mjs'
      - 'tools/test-layout-brand-title.mjs'
      - 'tools/test-layout-compact-filter.mjs'
      - 'tools/test-layout-tour-compact.mjs'
      - 'tools/test-layout-mobile-sheets.mjs'
      - 'tools/test-layout-inline-badges.mjs'
      - 'js/layout-tabler-ux.js'
      - 'js/layout-tabler.js'
      - '.github/workflows/responsive-density-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Locate browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test responsive spacing and title
        run: node --test --test-reporter=tap --test-concurrency=1 tools/test-layout-density.mjs tools/test-layout-brand-title.mjs tools/test-layout-compact-filter.mjs tools/test-layout-tour-compact.mjs tools/test-layout-mobile-sheets.mjs tools/test-layout-inline-badges.mjs tools/test-lrt-popup-compact-mobile.mjs tools/test-mobile-active-route.mjs tools/test-mobile-popup-system.mjs
