name: Desktop Panel to Popup Toggle QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/layout-tabler.css'
      - 'js/layout-tabler.js'
      - 'tools/test-layout-desktop-info-mode.mjs'
      - '.github/workflows/panel-popup-toggle-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toggle-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test Panel/Popup state, keyboard, camera and D4 integration
        run: node --test --test-reporter=tap tools/test-layout-desktop-info-mode.mjs
