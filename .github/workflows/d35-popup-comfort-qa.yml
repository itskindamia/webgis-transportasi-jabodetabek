name: D3.5 Popup Comfort Browser QA

on:
  pull_request:
    paths:
      - 'js/stop-popup-ui.js'
      - 'js/layout-tabler.js'
      - 'css/popup-comfort.css'
      - 'index.html'
      - 'tools/test-popup-comfort-d35.mjs'
      - '.github/workflows/d35-popup-comfort-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  popup-comfort:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Browser test compact popup and full panel
        run: node --test --test-reporter=tap tools/test-popup-comfort-d35.mjs
